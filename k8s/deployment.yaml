apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-risk
  labels: {app: heart-api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime model updates
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: heart-risk-api:1.0.0
          imagePullPolicy: IfNotPresent   # image is built locally (Docker Desktop / minikube)
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: LOG_LEVEL, value: INFO}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:            # only send traffic once the model is loaded
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
