apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-risk
  labels: {app: heart-api}
spec:
  type: LoadBalancer     # Docker Desktop maps this to localhost:80; minikube needs `minikube tunnel`
  selector: {app: heart-api}
  ports:
    - {name: http, port: 80, targetPort: http}
